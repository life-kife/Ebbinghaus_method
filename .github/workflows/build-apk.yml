name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Создание Android-проекта
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx capacitor-assets generate --android --iconBackgroundColor '#2F47C4' --iconBackgroundColorDark '#2F47C4' --splashBackgroundColor '#EEF0F3' --splashBackgroundColorDark '#12151C'
          sed -i 's/versionName "1.0"/versionName "1.2"/; s/versionCode 1$/versionCode 3/' android/app/build.gradle
          npx cap sync android

      - name: Постоянный ключ подписи (чтобы обновления ставились поверх)
        run: mkdir -p ~/.android && cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kartochki-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Публикация APK в Releases
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kartochki.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest kartochki.apk --title "Карточки (последняя сборка)" --notes "Отладочная сборка из ветки main, коммит ${GITHUB_SHA::7}." --latest
        env:
          GH_TOKEN: ${{ github.token }}
