<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карточки</title>
<style>
@font-face{font-family:"Golos Text";font-weight:400;font-display:swap;src:url(fonts/golos-text-cyrillic-400-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Golos Text";font-weight:400;font-display:swap;src:url(fonts/golos-text-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:"Golos Text";font-weight:500;font-display:swap;src:url(fonts/golos-text-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Golos Text";font-weight:500;font-display:swap;src:url(fonts/golos-text-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:"Golos Text";font-weight:600;font-display:swap;src:url(fonts/golos-text-cyrillic-600-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Golos Text";font-weight:600;font-display:swap;src:url(fonts/golos-text-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:"Literata";font-weight:500;font-display:swap;src:url(fonts/literata-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Literata";font-weight:500;font-display:swap;src:url(fonts/literata-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}
@font-face{font-family:"Literata";font-weight:700;font-display:swap;src:url(fonts/literata-cyrillic-700-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Literata";font-weight:700;font-display:swap;src:url(fonts/literata-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-21FF,U+2212,U+2215}

:root{
  --bg:#eef0f3; --surface:#ffffff; --sunken:#e5e8ee; --ink:#1b2130; --muted:#636c7c; --line:#d8dce4;
  --accent:#2f47c4; --accent-ink:#ffffff; --accent-soft:#e4e9fb;
  --again:#c2412d; --again-soft:#fbe9e5; --hard:#a86d0b; --hard-soft:#fbf1dc; --good:#2f8a4e; --good-soft:#e2f3e7;
  --d1:#2f47c4; --d2:#2f8a4e; --d3:#b4561f; --d4:#7a3fb0; --d5:#0f7e8c;
  --shadow:0 14px 34px -22px rgba(20,30,70,.45);
  --f-display:"Literata", "Noto Serif", Georgia, serif; --f-body:"Golos Text", system-ui, Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#12151c; --surface:#1b1f29; --sunken:#161a22; --ink:#e8eaef; --muted:#9aa2b2; --line:#2c3241;
  --accent:#8ea0ff; --accent-ink:#10142a; --accent-soft:#232a48;
  --again:#f08470; --again-soft:#3a201d; --hard:#e6b257; --hard-soft:#372b16; --good:#62c586; --good-soft:#1b3324;
  --d1:#8ea0ff; --d2:#62c586; --d3:#f0a070; --d4:#c49af0; --d5:#5ccbd8;
  --shadow:0 14px 34px -22px rgba(0,0,0,.8);
  color-scheme:dark}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 112px;display:grid;gap:22px}
.wrap.bare{padding-bottom:28px}
h1{font:700 1.7rem/1.2 var(--f-display);margin:0;letter-spacing:-.01em}
h2{font:600 1.08rem/1.3 var(--f-body);margin:0}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
.eyebrow{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

button{font:500 1rem var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 16px;cursor:pointer;transition:transform .12s,background .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.55}
.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.big{width:100%;padding:17px;font-size:1.08rem;border-radius:16px}
.link{border:0;background:none;color:var(--accent);padding:6px 0;font-weight:500}
input,textarea{font:inherit;color:var(--ink);background:var(--sunken);border:1px solid transparent;border-radius:12px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
textarea{min-height:110px;font-size:.88rem;resize:vertical}
label{display:grid;gap:6px;font-size:.88rem;color:var(--muted);font-weight:500}

/* --- Главная --- */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.9rem;white-space:nowrap}
.streak svg{width:18px;height:18px}
.streak.on{color:var(--hard);border-color:color-mix(in srgb,var(--hard) 40%,var(--line))}
.hero{background:var(--surface);border-radius:24px;padding:22px;display:grid;gap:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.hero-row{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.05}
.ring .val b{font:700 2rem var(--f-display);color:var(--accent);font-variant-numeric:tabular-nums}
.ring .val span{font-size:.72rem;color:var(--muted)}
.hero-txt{display:grid;gap:4px;min-width:0}
.hero-txt h2{font:700 1.25rem/1.25 var(--f-display)}
.decks{display:grid;gap:10px}
.deck{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;width:100%;border-radius:16px}
.deck .dot{width:12px;height:12px;border-radius:4px;flex:none}
.deck .name{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deck .n{font-size:.84rem;color:var(--muted);font-variant-numeric:tabular-nums}
.deck .n.has{color:var(--accent);font-weight:600}
.deck .chev{color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{display:grid;gap:6px;justify-items:center;font-size:.72rem;color:var(--muted)}
.week i{width:100%;max-width:34px;aspect-ratio:1;border-radius:10px;background:var(--sunken);display:grid;place-content:center;font-style:normal;font-size:.78rem;font-weight:600;color:var(--muted)}
.week i.on{background:var(--accent);color:var(--accent-ink)}
.week i.today{outline:2px solid var(--accent);outline-offset:1px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px}

/* --- Повторение --- */
.topbar{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;background:var(--sunken);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.stage{perspective:1400px}
.flip{position:relative;min-height:300px;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flip.turned{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 22px;display:grid;align-content:center;gap:16px;text-align:center;box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.face .tag{display:inline-flex;align-items:center;gap:6px;justify-self:center;font-size:.76rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.face .tag i{width:8px;height:8px;border-radius:3px}
.face .q{font:500 1.32rem/1.4 var(--f-display);overflow-wrap:anywhere}
.face .qsmall{font-size:.92rem;color:var(--muted);overflow-wrap:anywhere}
.face .a{font:500 1.25rem/1.45 var(--f-body);white-space:pre-wrap;overflow-wrap:anywhere}
.face .hint{font-size:.82rem;color:var(--muted)}
.enter{animation:enter .32s ease both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grade{display:grid;gap:3px;padding:14px 4px;border:0;border-radius:16px;font-weight:600;font-size:.95rem}
.grade small{font-weight:500;font-size:.74rem;opacity:.8}
.g-again{background:var(--again-soft);color:var(--again)}
.g-hard{background:var(--hard-soft);color:var(--hard)}
.g-good{background:var(--good-soft);color:var(--good)}
.done{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:30px}
.done .badge-big{width:96px;height:96px;border-radius:30px;background:var(--good-soft);color:var(--good);display:grid;place-content:center}
.done .badge-big svg{width:48px;height:48px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px;display:grid;gap:2px}
.tally b{font:700 1.5rem var(--f-display);font-variant-numeric:tabular-nums}
.tally span{font-size:.76rem;color:var(--muted)}

/* --- Карточки --- */
.search{position:relative}
.search input{padding-left:42px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;font-size:.88rem;display:inline-flex;align-items:center;gap:8px}
.chip i{width:8px;height:8px;border-radius:3px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.item .bar-l{width:4px;align-self:stretch;border-radius:4px;flex:none}
.item .txt{flex:1;min-width:0;display:grid;gap:2px}
.item .q{font-weight:500;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.item .meta{font-size:.8rem;color:var(--muted)}
.when{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--sunken);color:var(--muted)}
.when.now{background:var(--accent-soft);color:var(--accent)}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-content:center;box-shadow:0 12px 26px -10px rgba(47,71,196,.7);z-index:5}
.fab svg{width:26px;height:26px;stroke:currentColor;stroke-width:2.4;fill:none}

/* --- Нижний лист (форма) --- */
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:20;animation:fade .2s both}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.3,.7,.3,1) both}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);justify-self:center}
.sheet .in{max-width:560px;width:100%;margin:0 auto;display:grid;gap:14px}
.sheet .row2{display:flex;gap:10px}
.sheet .row2 > *{flex:1}
.danger{color:var(--again)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* --- Ещё --- */
.group{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.group > *+*{border-top:1px solid var(--line)}
.opt{display:flex;align-items:center;gap:14px;padding:15px 16px;width:100%;border:0;border-radius:0;background:none;text-align:left}
.opt .ic{width:36px;height:36px;border-radius:11px;display:grid;place-content:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.opt .ic svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.opt .t{flex:1;min-width:0;display:grid}
.opt .t small{color:var(--muted);font-size:.8rem}
.toggle{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;padding:0;border:0;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.toggle:checked{background:var(--accent)}
.toggle:checked::after{transform:translateX(20px)}
input[type=time].tm{width:auto;padding:8px 10px;font-weight:600}
.note{font-size:.84rem;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink)}
.note.warn{background:var(--hard-soft)}
table{border-collapse:collapse;width:100%;font-size:.8rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td.num{white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.foot{text-align:center;font-size:.78rem;color:var(--muted)}

/* --- Знакомство --- */
.onb{min-height:calc(100vh - env(safe-area-inset-top,0px));display:grid;grid-template-rows:auto 1fr auto;gap:20px;padding-block:20px calc(24px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}
.onb .skip{justify-self:end}
.onb .art{display:grid;place-content:center}
.onb .art svg{width:min(78vw,320px);height:auto}
.onb .txt{display:grid;gap:10px;text-align:center}
.onb .txt h1{font-size:1.75rem}
.onb .dots{display:flex;gap:6px;justify-content:center}
.onb .dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:width .2s}
.onb .dots i.on{width:22px;background:var(--accent)}
.onb .bottom{display:grid;gap:16px}

/* --- Навигация --- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{display:flex;gap:4px;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:6px 4px;display:grid;gap:3px;justify-items:center;font-size:.76rem;font-weight:500;position:relative}
nav button .pill{width:58px;height:30px;border-radius:99px;display:grid;place-content:center;transition:background .2s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9}
nav button[aria-current="true"]{color:var(--ink)}
nav button[aria-current="true"] .pill{background:var(--accent-soft);color:var(--accent)}
nav .badge{position:absolute;top:2px;left:calc(50% + 10px);font-size:.66rem;font-weight:700;background:var(--again);color:#fff;border-radius:99px;padding:1px 6px;line-height:1.3}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-size:.9rem;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="layer"></div>

<nav aria-label="Разделы" id="nav"><div class="in">
  <button data-go="home"><span class="pill"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9.5 20v-5.5h5V20"/></svg></span>Сегодня<span class="badge" id="badge" hidden></span></button>
  <button data-go="cards"><span class="pill"><svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="13" height="13" rx="2.5"/><path d="M8 4h10a2.5 2.5 0 0 1 2.5 2.5V16"/></svg></span>Карточки</button>
  <button data-go="more"><span class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Настройки</button>
</div></nav>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
const KEY = 'ebb-cards-v1';
const DAY = 86400000;
const REMIND_DAYS = 30, REMIND_ID_BASE = 1000;

// ---------- Утилиты ----------
const realToday = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY); };
const fmt = n => new Date(n * DAY).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', timeZone: 'UTC' });
const wd = n => new Date(n * DAY).toLocaleDateString('ru-RU', { weekday: 'short', timeZone: 'UTC' }).replace('.', '');
const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
const cardsWord = n => n + ' ' + plural(n, 'карточка', 'карточки', 'карточек');
const daysWord = n => n + ' ' + plural(n, 'день', 'дня', 'дней');
const inDays = n => n <= 0 ? 'сегодня' : n === 1 ? 'завтра' : n < 30 ? `через ${daysWord(n)}` : n < 365 ? `через ${Math.round(n / 30)} ${plural(Math.round(n / 30), 'месяц', 'месяца', 'месяцев')}` : 'через год';
const ICON = {

// ---------- SM-2 ----------
function sm2(card, q) {
  const c = { ...card };
  if (q < 3) { c.reps = 0; c.interval = 0; }
  else {
    c.interval = c.reps === 0 ? 1 : c.reps === 1 ? 6 : Math.round(c.interval * c.ease);
    if (q === 3 && c.reps >= 2) c.interval = Math.max(1, Math.round(c.interval * 0.6));
    c.reps++;
  }
  c.ease = Math.max(1.3, +(c.ease + 0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)).toFixed(2));
  c.due = today() + c.interval;
  return c;
}
const GRADES = [
  { q: 1, name: 'Не помню', cls: 'g-again' },
  { q: 3, name: 'С трудом', cls: 'g-hard' },

];
const decks = () => [...new Set(state.cards.map(c => c.deck))].sort((a, b) => a.localeCompare(b, 'ru'));
const deckColor = d => `var(--d${(decks().indexOf(d) % 5) + 1})`;
const due = deck => state.cards.filter(c => c.due <= today() && (!deck || c.deck === deck));
const newCard = (q, a, deck) => ({ id: uid(), q, a, deck, due: today(), interval: 0, ease: 2.5, reps: 0 });
const doneToday = () => state.log[today()] || 0;
function streak() {
  let d = today(), n = 0;
  if (!state.log[d]) d--;                         // сегодня ещё не занимался — серия не сгорает до конца дня
  while (state.log[d]) { n++; d--; }
  return n;
}

function paintStatusBar() {

async function ensurePermission(ask) {
  if (!LN) return false;
  try {
    let p = await LN.checkPermissions();
    if (p.display !== 'granted' && ask) p = await LN.requestPermissions();
    permission = p.display;
    return p.display === 'granted';
  } catch (e) { permission = 'error'; return false; }
}
const dueOn = i => state.cards.filter(c => c.due <= today() + i);
async function scheduleReminders() {
  if (!LN) return;
  try {
    await LN.cancel({ notifications: Array.from({ length: REMIND_DAYS }, (_, i) => ({ id: REMIND_ID_BASE + i })) });
    if (!state.settings.remind || permission !== 'granted') return;
    const [hh, mm] = state.settings.time.split(':').map(Number);
    const now = new Date(), list = [];
    for (let i = 0; i < REMIND_DAYS; i++) {
      const cards = dueOn(i);
      if (!cards.length) continue;
      const at = new Date(now.getFullYear(), now.getMonth(), now.getDate() + i, hh, mm, 0, 0);
      if (at <= now) continue;
      const parts = Object.entries(cards.reduce((m, c) => (m[c.deck] = (m[c.deck] || 0) + 1, m), {})).map(([k, v]) => `${k} · ${v}`).join(', ');
      list.push({ id: REMIND_ID_BASE + i, title: `Пора повторить ${cardsWord(cards.length)}`,
        body: `${parts}. Около ${Math.max(1, Math.round(cards.length * 0.3))} мин.`,
        schedule: { at, allowWhileIdle: true }, extra: { open: 'review' } });
    }
    if (list.length) await LN.schedule({ notifications: list });
  } catch (e) { console.error('schedule', e); }
}
async function testNotification() {
  if (!LN) { toast('Уведомления работают в приложении на телефоне'); return; }
  if (!(await ensurePermission(true))) { toast('Разрешите уведомления в настройках телефона'); render(); return; }
  await LN.schedule({ notifications: [{ id: 1, title: 'Так будет выглядеть напоминание', body: `Сейчас к повторению: ${cardsWord(due().length)}`, schedule: { at: new Date(Date.now() + 10000), allowWhileIdle: true }, extra: { open: 'review' } }] });
  toast('Уведомление придёт через 10 секунд. Можно свернуть приложение.');
}

}

// ---------- Повторение ----------
function startSession(deck) { session = { deck, total: due(deck).length, done: 0, revealed: false, current: null, tally: { 1: 0, 3: 0, 4: 0 } }; buzz('LIGHT'); go('review'); }
function nextCard() { const l = due(session.deck); l.sort((a, b) => (a.reps === 0) - (b.reps === 0) || a.due - b.due); return l[0] || null; }
function renderReview() {
  if (!session) return go('home');
  const fresh = !session.current;
  const c = session.current || (session.current = nextCard());
  const pct = Math.min(100, Math.round(session.done / Math.max(1, session.total) * 100));
  if (!c) {
    const next = state.cards.map(x => x.due).filter(d => d > today()).sort((a, b) => a - b)[0];
    const st = streak();
    $('app').innerHTML = `<div class="done enter">
      <div class="badge-big">${ICON.check}</div>
      <div style="display:grid;gap:6px"><h1>Готово!</h1><p class="muted">Повторено ${cardsWord(session.done)}${st ? ` · серия ${daysWord(st)}` : ''}</p></div>
      <div class="tally"><div><b style="color:var(--good)">${session.tally[4]}</b><span>помню</span></div><div><b style="color:var(--hard)">${session.tally[3]}</b><span>с трудом</span></div><div><b style="color:var(--again)">${session.tally[1]}</b><span>не помню</span></div></div>
      <p class="muted small">${next !== undefined ? `Следующее повторение ${inDays(next - today())}.` : ''}</p>
      <button class="primary big" id="home">Отлично</button></div>`;
    $('home').onclick = () => { session = null; go('home'); };
    buzz('MEDIUM');
    return;
  }
  const col = deckColor(c.deck);
  $('app').innerHTML = `
    <div class="topbar"><button class="link" id="back" aria-label="Выйти">✕</button><div class="bar"><i style="width:${pct}%"></i></div><span class="muted small" style="font-variant-numeric:tabular-nums">${session.done}/${session.total}</span></div>
    <div class="stage ${fresh ? 'enter' : ''}"><div class="flip ${session.revealed ? 'turned' : ''}" id="flip">
      <article class="face front"><span class="tag"><i style="background:${col}"></i>${esc(c.deck)}</span><div class="q">${esc(c.q)}</div><p class="hint">Вспомните ответ, затем нажмите на карточку</p></article>
      <article class="face back"><span class="tag"><i style="background:${col}"></i>${esc(c.deck)}</span><div class="qsmall">${esc(c.q)}</div><div class="a">${esc(c.a)}</div></article>
    </div></div>
    <div id="actions">${actions(c)}</div>`;
  fitFlip();
  $('back').onclick = () => { session = null; go('home'); };
  $('flip').onclick = reveal;
  bindActions();
}
function actions(c) {
  return session.revealed
    ? `<div class="grades">${GRADES.map(g => { const n = sm2(c, g.q).interval; return `<button class="grade ${g.cls}" data-q="${g.q}">${g.name}<small>${n === 0 ? 'ещё раз' : inDays(n)}</small></button>`; }).join('')}</div>`
    : `<button class="primary big" id="show">Показать ответ</button>`;
}
function bindActions() {
  const s = $('show'); if (s) s.onclick = reveal;
  document.querySelectorAll('.grade').forEach(b => b.onclick = () => grade(+b.dataset.q));
}
function fitFlip() {   // высота карточки по самой высокой стороне
  const f = $('flip'); if (!f) return;
  const h = Math.max(...[...f.children].map(el => { el.style.position = 'relative'; const v = el.offsetHeight; el.style.position = ''; return v; }));
  f.style.minHeight = Math.max(300, h) + 'px';
}
function reveal() {
  if (session.revealed) return;
  session.revealed = true; buzz('LIGHT');
  $('flip').classList.add('turned');
  $('actions').innerHTML = actions(session.current); bindActions();
}
function grade(q) {
  const i = state.cards.findIndex(c => c.id === session.current.id);
  state.cards[i] = sm2(state.cards[i], q);
  if (q < 3) { state.cards[i].due = today(); session.total++; }
  state.log[today()] = (state.log[today()] || 0) + 1;
  session.tally[q]++; session.done++; session.current = null; session.revealed = false;
  buzz(q < 3 ? 'MEDIUM' : 'LIGHT');
  save(); render(); scheduleReminders();
}

// ---------- Карточки ----------
function renderCards() {
  const q = cardQuery.trim().toLowerCase();
  if (cardFilter && !decks().includes(cardFilter)) cardFilter = '';
  const list = state.cards.filter(c => (!cardFilter || c.deck === cardFilter) && (!q || (c.q + ' ' + c.a).toLowerCase().includes(q))).sort((a, b) => a.due - b.due);
  $('app').innerHTML = `
    <header class="top"><div><p class="eyebrow">${cardsWord(state.cards.length)}</p><h1>Карточки</h1></div></header>
    <div class="search">${ICON.search}<input id="q" type="search" placeholder="Поиск по вопросам и ответам" value="${esc(cardQuery)}"></div>
    <div class="filters"><button class="chip" data-f="" aria-pressed="${!cardFilter}">Все</button>
      ${decks().map(d => `<button class="chip" data-f="${esc(d)}" aria-pressed="${cardFilter === d}"><i style="background:${deckColor(d)}"></i>${esc(d)}</button>`).join('')}</div>
    <section class="list">
      ${list.map(c => { const d = c.due - today(); return `<button class="item" data-edit="${c.id}"><i class="bar-l" style="background:${deckColor(c.deck)}"></i>
        <span class="txt"><span class="q">${esc(c.q)}</span><span class="meta">${esc(c.deck)}${c.reps === 0 && c.interval === 0 ? ' · новая' : ''}</span></span>
        <span class="when ${d <= 0 ? 'now' : ''}">${d <= 0 ? 'сегодня' : d === 1 ? 'завтра' : fmt(c.due)}</span></button>`; }).join('')
        || `<div class="panel center"><h2>${q ? 'Ничего не нашлось' : 'Пока пусто'}</h2><p class="muted small">${q ? 'Попробуйте другое слово.' : 'Нажмите «+», чтобы создать карточку, или загрузите их из таблицы в настройках.'}</p></div>`}
    </section>
    <button class="fab" id="fab" aria-label="Новая карточка">${ICON.plus}</button>`;
  const qi = $('q');
  qi.oninput = () => { cardQuery = qi.value; const pos = qi.selectionStart; renderCards(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); };
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { cardFilter = b.dataset.f; renderCards(); });
  document.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openSheet(b.dataset.edit));
  $('fab').onclick = () => openSheet();
}

// ---------- Лист создания / редактирования ----------
function openSheet(id) {
  const c = id ? state.cards.find(x => x.id === id) : null;
  sheetOpen = id || 'new';
  const deckDefault = c ? c.deck : cardFilter || decks()[0] || 'Общая';
  $('layer').innerHTML = `<div class="sheet-bg" id="sbg"></div>
    <form class="sheet" id="sheet"><div class="grab"></div><div class="in">
      <h2>${c ? 'Карточка' : 'Новая карточка'}</h2>
      <label>Вопрос<textarea id="fQ" required rows="2" style="min-height:70px" placeholder="Например: какой регистр — счётчик для LOOP?">${c ? esc(c.q) : ''}</textarea></label>
      <label>Ответ<textarea id="fA" required rows="2" style="min-height:70px" placeholder="CX">${c ? esc(c.a) : ''}</textarea></label>
      <label>Колода<input id="fD" list="deckList" required value="${esc(deckDefault)}"></label>
      <datalist id="deckList">${decks().map(d => `<option value="${esc(d)}">`).join('')}</datalist>
      ${c ? `<p class="muted small">Следующее повторение ${inDays(c.due - today())} · интервал ${daysWord(c.interval)}</p>` : ''}
      <div class="row2">${c ? '<button type="button" id="del" class="danger">Удалить</button>' : '<button type="button" id="cancel">Отмена</button>'}<button class="primary" type="submit">${c ? 'Сохранить' : 'Добавить'}</button></div>
    </div></form>`;
  $('sbg').onclick = closeSheet;
  const cancel = $('cancel'); if (cancel) cancel.onclick = closeSheet;
  let sure = false;
  const del = $('del'); if (del) del.onclick = () => {
    if (!sure) { sure = true; del.textContent = 'Точно удалить?'; return; }
    state.cards = state.cards.filter(x => x.id !== id); save(); closeSheet(); render(); scheduleReminders(); toast('Карточка удалена');
  };
  $('sheet').onsubmit = e => {
    e.preventDefault();
    const q = $('fQ').value.trim(), a = $('fA').value.trim(), d = $('fD').value.trim() || 'Общая';
    if (!q || !a) return;
    if (c) Object.assign(c, { q, a, deck: d }); else state.cards.push(newCard(q, a, d));
    save(); buzz('LIGHT');
    if (c) { closeSheet(); toast('Сохранено'); }
    else { $('fQ').value = ''; $('fA').value = ''; $('fQ').focus(); toast('Добавлено. Можно сразу следующую'); }
    render(); scheduleReminders();
  };
  if (!c) setTimeout(() => $('fQ') && $('fQ').focus(), 250);
}
function closeSheet() { if (!sheetOpen) return; sheetOpen = null; $('layer').innerHTML = ''; }

// ---------- Настройки ----------
function splitLine(line, sep) {
  const res = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) { const ch = line[i];
    if (ch === '"') { if (inQ && line[i + 1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (ch === sep && !inQ) { res.push(cur); cur = ''; } else cur += ch; }
  res.push(cur); return res;
}
function parseCSV(text) {
  const lines = text.replace(/^﻿/, '').split(/\r?\n/).filter(l => l.trim());
  const sep = lines.length && lines[0].includes(';') ? ';' : ',';
  return lines.map(l => splitLine(l, sep).map(s => s.trim()))
    .filter(c => c.length >= 2 && c[0] && c[1] && !/^(вопрос|question|front)$/i.test(c[0]))
    .map(c => newCard(c[0], c[1], c[2] || 'Импорт'));
}
const csvCell = s => /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
async function copy(area) { try { await navigator.clipboard.writeText(area.value); toast('Скопировано'); } catch (e) { area.focus(); area.select(); toast('Текст выделен, скопируйте его'); } }
let morePanel = '';
function renderMore() {
  const permOk = permission === 'granted' || !isNative;
  const st = state.settings;
  const opt = (id, icon, title, sub) => `<button class="opt" data-p="${id}"><span class="ic">${icon}</span><span class="t">${title}<small>${sub}</small></span><span class="muted">${morePanel === id ? '⌃' : '›'}</span></button>`;
  $('app').innerHTML = `
    <header><p class="eyebrow">Карточки 1.1</p><h1>Настройки</h1></header>
    <section class="group">
      <label class="opt"><span class="ic">${ICON.bell}</span><span class="t">Напоминания<small>${st.remind ? (permOk ? 'В дни, когда есть карточки' : 'Нет разрешения на уведомления') : 'Выключены'}</small></span><input type="checkbox" class="toggle" id="remOn" ${st.remind ? 'checked' : ''}></label>
      <label class="opt" ${st.remind ? '' : 'style="opacity:.5"'}><span class="ic">${ICON.clock}</span><span class="t">Время<small>Ежедневно, если есть что повторить</small></span><input type="time" class="tm" id="remTime" value="${st.time}" ${st.remind ? '' : 'disabled'}></label>
      <button class="opt" id="testN"><span class="ic">${ICON.info}</span><span class="t">Проверить уведомление<small>Придёт через 10 секунд</small></span><span class="muted">›</span></button>
    </section>
    ${isNative && st.remind && !permOk ? `<p class="note warn">Без разрешения напоминания не придут. Нажмите «Проверить уведомление», и телефон спросит разрешение.</p>` : ''}
    <section class="group">
      ${opt('imp', ICON.down, 'Загрузить из таблицы', 'CSV: вопрос;ответ;колода')}
      ${morePanel === 'imp' ? `<div class="panel" style="border:0;border-radius:0">
        <p class="muted small">Сохраните таблицу из Excel как «CSV UTF-8». Колонку колоды можно не заполнять.</p>
        <input type="file" id="csvFile" accept=".csv,.txt,text/csv,text/plain">
        <textarea id="csvText" spellcheck="false" placeholder="Что делает fork()?;Создаёт копию процесса;ОС UNIX"></textarea>
        <button class="primary" id="doImport">Загрузить</button><p class="muted small" id="importInfo"></p></div>` : ''}
      ${opt('exp', ICON.up, 'Резервная копия', 'Скопировать все карточки текстом')}
      ${morePanel === 'exp' ? `<div class="panel" style="border:0;border-radius:0"><textarea id="exportText" readonly>${esc(state.cards.map(c => [c.q, c.a, c.deck].map(csvCell).join(';')).join('\n'))}</textarea><button id="copyExp">Копировать</button></div>` : ''}
      ${opt('lab', ICON.flask, 'Для проверки прототипа', 'Перемотка даты и параметры SM-2')}
      ${morePanel === 'lab' ? `<div class="panel" style="border:0;border-radius:0">
        <p class="muted small">Дата в приложении: <b>${fmt(today())}</b>${state.offset ? ` (+${daysWord(state.offset)})` : ''}</p>
        <div class="row2"><button id="d1">+1 день</button><button id="d7">+7 дней</button><button id="d0" ${state.offset ? '' : 'disabled'}>Сегодня</button></div>
        <div class="scroll"><table><thead><tr><th>Вопрос</th><th>Интервал</th><th>Лёгкость</th><th>Подряд</th></tr></thead><tbody>
          ${state.cards.map(c => `<tr><td>${esc(c.q)}</td><td class="num">${c.interval} дн.</td><td class="num">${c.ease.toFixed(2)}</td><td class="num">${c.reps}</td></tr>`).join('')}</tbody></table></div>
        <button id="onbAgain">Показать знакомство заново</button>
        <button id="reset" class="danger">Вернуть примерные карточки</button></div>` : ''}
    </section>
    <p class="foot">Интервалы считаются по алгоритму SM-2 на основе кривой забывания Эббингауза.</p>`;

  $('remOn').onchange = async e => { st.remind = e.target.checked; save(); if (st.remind) await ensurePermission(true); await scheduleReminders(); renderMore(); };
  $('remTime').onchange = async e => { if (!e.target.value) return; st.time = e.target.value; save(); await scheduleReminders(); toast('Напоминание в ' + st.time); };
  $('testN').onclick = testNotification;
  document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { morePanel = morePanel === b.dataset.p ? '' : b.dataset.p; renderMore(); });
  if (morePanel === 'imp') {
    $('csvFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('csvText').value = r.result; }; r.readAsText(f, 'utf-8'); };
    $('doImport').onclick = () => {
      const cards = parseCSV($('csvText').value);
      if (!cards.length) { $('importInfo').textContent = 'Не нашлось строк вида «вопрос;ответ». Проверьте разделитель «;».'; return; }
      state.cards.push(...cards); save(); scheduleReminders(); morePanel = ''; render(); toast(`Загружено: ${cardsWord(cards.length)}`);
    };
  }
  if (morePanel === 'exp') $('copyExp').onclick = () => copy($('exportText'));
  if (morePanel === 'lab') {
    const shift = n => () => { state.offset = n === 0 ? 0 : state.offset + n; save(); scheduleReminders(); render(); toast('Дата: ' + fmt(today())); };
    $('d1').onclick = shift(1); $('d7').onclick = shift(7); $('d0').onclick = shift(0);
    $('onbAgain').onclick = () => { onbStep = 0; morePanel = ''; go('onboarding'); };
    let sure = false;
    $('reset').onclick = e => { if (!sure) { sure = true; e.target.textContent = 'Нажмите ещё раз для подтверждения'; return; }
      state.cards = sample(); state.offset = 0; state.log = {}; save(); scheduleReminders(); render(); toast('Примерные карточки восстановлены'); };
  }
}

// ---------- Запуск ----------
document.querySelectorAll('nav [data-go]').forEach(b => b.onclick = () => { session = null; buzz('LIGHT'); go(b.dataset.go); });
window.addEventListener('resize', fitFlip);

async function init() {
  load();
  screen = state.onboarded ? 'home' : 'onboarding';
  render(); paintStatusBar();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintStatusBar);
  if (!isNative) return;
  if (state.onboarded) { await ensurePermission(false); await scheduleReminders(); render(); }
  if (LN) LN.addListener('localNotificationActionPerformed', () => { if (!state.onboarded) return; if (due().length) startSession(''); else go('home'); });
  if (App) App.addListener('backButton', () => {
    if (sheetOpen) closeSheet();
    else if (screen === 'review') { session = null; go('home'); }
    else if (screen === 'onboarding') { if (onbStep > 0) { onbStep--; renderOnboarding(); } else App.exitApp(); }
    else if (screen !== 'home') go('home');
    else App.exitApp();
  });
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    await ensurePermission(false); scheduleReminders();
    if (screen === 'home' || screen === 'more') render();
  });
}
init();
})();
</script>
</body>
</html>
